<section class="courses-hero">
  <h1>Discover courses crafted by industry experts</h1>
  <form [formGroup]="filters" class="filters">
    <input type="text" placeholder="Search courses" formControlName="keyword">
    <select formControlName="level">
      <option value="">All Levels</option>
      <option value="Beginner">Beginner</option>
      <option value="Intermediate">Intermediate</option>
      <option value="Advanced">Advanced</option>
    </select>
  </form>
</section>

<section class="courses-grid" *ngIf="filteredCourses$ | async as courses">
  <article class="course" *ngFor="let course of courses">
    <div class="course__header">
      <span class="course__level">{{ course.level }}</span>
      <h2>{{ course.title }}</h2>
    </div>
    <p>{{ course.summary }}</p>
    <div class="course__meta">
      <span>Duration: {{ course.duration }}</span>
      <span class="course__price" *ngIf="course.price">${{ course.price }}</span>
    </div>
    <a [routerLink]="[course.id]" class="course__cta">View details</a>
  </article>
</section>
